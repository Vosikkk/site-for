name: Site quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  content-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate claims, affiliate tags, and disclosures
        run: python3 scripts/validate-content.py
      - name: Test home server build planner decisions
        run: node --test tests/build-planner.test.js
