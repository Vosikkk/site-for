{{- $destination := .Destination | safeURL -}}
{{- $isAmazon := or (strings.Contains .Destination "amazon.com") (strings.Contains .Destination "amzn.to") -}}
<a href="{{ $destination }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $isAmazon }} rel="sponsored nofollow noopener"{{ else if or (strings.HasPrefix .Destination "http://") (strings.HasPrefix .Destination "https://") }} rel="noopener"{{ end }}>{{ .Text | safeHTML }}</a>
