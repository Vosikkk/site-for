baseURL = 'https://runahomelab.com/'
locale = "en-US" 
title = 'Proxmox Homelab Guides: Mini PCs, Fixes and Self-Hosting (2026)'
theme = 'PaperMod'
enableRobotsTXT = true
enableGitInfo = true
[services]
  [services.googleAnalytics]
    id = 'G-DCJQ8L1ZRN'
[pagination]
  pagerSize = 10
[params]
  env = 'production'
  description = 'Practical Proxmox and homelab guides — mini PC picks, guest agent fixes, self-hosted apps, and beginner builds without the fluff.'
  author = 'Oleksandr Voskolovych'
  authorURL = 'https://runahomelab.com/about/'
  authorLinkedIn = 'https://www.linkedin.com/in/sasha-voskolovych/'
  defaultTheme = 'auto'          # auto / dark / light
  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  [params.assets]
    disableHLJS = false
    disableFingerprinting = false
  [params.label]
    text = "Run a Home Lab"
    icon = "/favicon.ico"
  [params.homeInfoParams]
    Title = "Practical Homelab Guides for Proxmox and Self-Hosting"
    Content = "Clear Proxmox fixes, mini PC hardware guides, and practical self-hosting. Build it, fix it, run it."
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Vosikkk"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/sasha-voskolovych/"
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "methodology"
    name = "Methodology"
    url = "/methodology/"
    weight = 25
  [[menu.main]]
    identifier = "privacy"
    name = "Privacy"
    url = "/privacy/"
    weight = 30
  [taxonomies]
    tag = "tags"
