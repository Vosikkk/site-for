baseURL = 'https://runahomelab.com/'   # потім заміниш
locale = "en-US" 
title = 'Proxmox Homelab Guides: Mini PCs, Fixes and Self-Hosting (2026)'
theme = 'PaperMod'
enableRobotsTXT = true
enableGitInfo = true
[pagination]
  pagerSize = 10
[params]
  env = 'production'
  description = 'Practical Proxmox and homelab guides — mini PC picks, guest agent fixes, self-hosted apps, and beginner builds without the fluff.'
  author = 'Vosik'
  defaultTheme = 'auto'          # auto / dark / light
  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  [params.assets]
    disableHLJS = false
    disableFingerprinting = false
  [params.label]
    text = "Run a Home Lab"
    icon = "/favicon.ico"
  [params.homeInfoParams]
    Title = "Practical Homelab Guides for Proxmox and Self-Hosting"
    Content = "Clear Proxmox fixes, mini PC picks, and self-hosted app guides. No fluff, current for 2026."
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Vosikkk"
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "privacy"
    name = "Privacy"
    url = "/privacy/"
    weight = 30
  [taxonomies]
    tag = "tags"